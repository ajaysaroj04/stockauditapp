name: vehicle_scanner
description: Scan vehicle barcodes, parse VIN / spec / fuel type, store locally and analyse on a dashboard.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^6.0.2        # ML Kit based 1D/2D barcode scanning
  sqflite: ^2.3.3               # local SQLite storage
  path: ^1.9.0
  path_provider: ^2.1.4
  share_plus: ^10.1.4           # share / save the exported CSV
  csv: ^6.0.0
  intl: ">=0.19.0 <1.0.0"
  permission_handler: ^11.3.1   # only used to open app settings after a camera denial

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
